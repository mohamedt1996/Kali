name: Inspect built Kali image against vendor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-kali-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/volkspc-source
          key: volkspc-source-KdFBkaBB-v1
      - name: Mount vendor and latest Kali image
        run: |
          gh run download 42081907272 --name volkspc-kali-arm64-experimental --dir art
          unzip -q art/volkspcimgarm64.zip linuxfs.img -d kali
          mkdir v k
          sudo mount -t ext4 -o loop,ro,noload "$RUNNER_TEMP/volkspc-source/linuxfs.img" v
          sudo mount -t ext4 -o loop,ro,noload kali/linuxfs.img k
      - name: Compare autostart, session and input-related setup
        run: |
          echo '===== AUTOSTART ONLY IN KALI'
          comm -13 <(ls v/etc/xdg/autostart | sort) <(ls k/etc/xdg/autostart | sort) || true
          for f in $(comm -13 <(ls v/etc/xdg/autostart | sort) <(ls k/etc/xdg/autostart | sort)); do
            echo "--- $f"; grep -E '^(Exec|OnlyShowIn|NotShowIn|Hidden|X-GNOME-Autostart-enabled)=' "k/etc/xdg/autostart/$f" || true
          done
          echo '===== KALI XFCE XDG CONFIG'; ls -la k/etc/xdg/xfce4/ k/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/ 2>&1 || true
          echo '===== KALI HOME CONFIG'; sudo find k/home/desktop -maxdepth 4 | sort
          echo '===== KALI bash_profile'; sudo cat k/home/desktop/.bash_profile
          echo '===== startxfce4 diff'; diff v/usr/bin/startxfce4 k/usr/bin/startxfce4 || true
          echo '===== xinitrc diff'; diff v/etc/xdg/xfce4/xinitrc k/etc/xdg/xfce4/xinitrc || true
          echo '===== Kali xfconf defaults that differ'
          for f in k/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/*.xml; do b=$(basename "$f"); if [ -f "v/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/$b" ]; then diff -q "v/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/$b" "$f" >/dev/null || { echo "--- DIFF $b"; diff "v/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/$b" "$f" | head -60; }; else echo "--- ONLY KALI $b"; head -80 "$f"; fi; done
          echo '===== PACKAGE VERSION DIFFERENCES (X/GTK/Xfce/input)'
          python3 - <<'PY'
          def load(root):
              d={}
              for p in open(root+'/var/lib/dpkg/status').read().split('\n\n'):
                  f=dict(l.split(': ',1) for l in p.splitlines() if ': ' in l and not l.startswith(' '))
                  if 'Package' in f and 'installed' in f.get('Status',''): d[f['Package']]=f.get('Version')
              return d
          v,k=load('v'),load('k')
          import re
          pat=re.compile(r'(xf|xfce|gtk|gdk|libx|xcb|xi|xinput|glib|cairo|pango|wayland|xkb|qt|screensaver|locker|power|polkit|libinput|xorg|xserver|lightdm|at-spi|atk)')
          for n in sorted(set(v)|set(k)):
              if pat.search(n) and v.get(n)!=k.get(n): print(f'{n:45} vendor={v.get(n)}  kali={k.get(n)}')
          PY
      - name: Check dependencies of every X client Kali autostarts or the panel loads
        run: |
          sudo mount --bind /dev k/dev 2>/dev/null || true
          sudo umount k 2>/dev/null || true
          sudo mount -t ext4 -o loop kali/linuxfs.img k
          sudo mount --bind /proc k/proc
          sudo chroot k /usr/bin/env LD_LIBRARY_PATH=/opt/volkspc/lib /bin/bash -c '
            for p in /usr/bin/xfwm4 /usr/bin/xfce4-panel /usr/bin/xfsettingsd /usr/bin/xfce4-power-manager /usr/bin/xfce4-screensaver /usr/bin/light-locker /usr/bin/nm-applet /usr/bin/blueman-applet /usr/bin/xiccd /usr/bin/xfce4-notifyd /usr/lib/aarch64-linux-gnu/xfce4/notifyd/xfce4-notifyd /usr/lib/aarch64-linux-gnu/xfce4/panel/wrapper-2.0 /usr/bin/xfce4-terminal /usr/bin/qterminal /usr/bin/thunar; do
              [ -e "$p" ] || continue
              out=$(ldd -r "$p" 2>&1)
              bad=$(printf "%s\n" "$out" | grep -E "not found|undefined symbol" | head -8)
              echo "--- $p ${bad:+PROBLEM}"; [ -n "$bad" ] && echo "$bad"
              printf "%s\n" "$out" | grep -E "libX11|libxcb.so|libgtk|libgdk|libXi\.|libxcb-xinput" | sed "s/^/    /"
            done
            echo "===== setuid/setgid X-related"; find /usr/bin /usr/sbin /usr/lib -perm /6000 -type f 2>/dev/null | head -40
          '
          sudo umount k/proc; sudo umount k
