name: Inspect VolksPC input integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-input.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/cache/restore@v4
        id: source
        with:
          path: ${{ runner.temp }}/volkspc-source
          key: volkspc-source-KdFBkaBB-v1
      - name: Fetch source if cache is unavailable
        if: steps.source.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools
          megadl --path "$RUNNER_TEMP/source.zip" 'https://mega.nz/file/KdFBkaBB#1piuceTTQsi5NlhnUAWqsa6UbPoL-KMunXK0LVa4AdM'
          mkdir -p "$RUNNER_TEMP/volkspc-source"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/volkspc-source"
      - name: Inspect vendor login, session and input startup
        run: |
          mkdir source-mount
          sudo mount -t ext4 -o loop,ro,noload "$RUNNER_TEMP/volkspc-source/linuxfs.img" source-mount
          cd source-mount
          show() { for f in "$@"; do if sudo test -f "$f"; then echo "===== FILE $f"; sudo cat "$f"; echo; fi; done; }
          echo '===== HOME LISTING'; sudo find home/desktop -maxdepth 2 -printf '%M %s %p\n' | sort -k3
          echo '===== AUTOSTART'; sudo find etc/xdg/autostart home/desktop/.config/autostart -maxdepth 1 -type f 2>/dev/null || true
          show home/desktop/.bash_profile home/desktop/.profile home/desktop/.bashrc home/desktop/.xinitrc \
               home/desktop/.xsession home/desktop/.xsessionrc home/desktop/.Xresources home/desktop/.xprofile \
               home/desktop/myxmodmap home/desktop/.config/waylandx11.ini home/desktop/.vnc/xstartup home/desktop/Desktop/ReleaseNotes.txt etc/rc.chroot etc/environment etc/X11/Xsession etc/X11/xinit/xinitrc \
               etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml \
               home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml \
               home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml/pointers.xml \
               home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml \
               home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml \
               usr/bin/startx11env usr/bin/installx11env usr/bin/androidhome usr/bin/androidview usr/bin/open
          for f in $(sudo find etc/profile.d etc/ld.so.conf.d etc/X11/Xsession.d etc/environment.d -type f 2>/dev/null || true); do show "$f"; done
          for f in $(sudo find etc/xdg/autostart home/desktop/.config/autostart -type f 2>/dev/null || true); do show "$f"; done
          for p in usr/bin/waylandx11 usr/bin/x11setaccel usr/bin/x11info usr/lib/aarch64-linux-gnu/libX11.so.6.4.0 usr/lib/aarch64-linux-gnu/libgdk-3.so.0.2417.32 usr/lib/aarch64-linux-gnu/libxcb.so.1.1.0; do
            echo "===== STRINGS $p"
            sudo strings -n 5 "$p" | grep -iE 'x11dev|/dev/|/tmp/|getenv|XINPUT|XI2|touch|mouse|pointer|MICROX|GDK_|DISPLAY|volkspc|evdev|accel|_ENV|^[A-Z][A-Z0-9_]{4,}$' | sort -u | head -150 || true
          done
          echo '===== PACKAGE VERSIONS'
          sudo python3 - <<'PY'
          status=open('var/lib/dpkg/status').read()
          want={'xfwm4','xfce4-session','libgtk-3-0t64','libxi6','libx11-6','xfce4-panel','xfdesktop4','libglib2.0-0t64','xfce4-settings','libxfixes3','libxkbcommon0','libwayland-server0'}
          for p in status.split('\n\n'):
              f=dict(l.split(': ',1) for l in p.splitlines() if ': ' in l and not l.startswith(' '))
              if f.get('Package') in want: print(f['Package'], f.get('Version'), f.get('Status'))
          PY
          cd ..; sudo umount source-mount
